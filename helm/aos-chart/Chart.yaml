apiVersion: v2
name: nexora
description: >
  Nexora OS — shared chart for a single Nexora OS service deployment
  (Deployment, Service, ConfigMap for NEXORA_* env, Secret refs, HPA, PDB, probes).
  Install once per service with a service-specific values file:
    helm install -n nexora workforce ./nexora-chart -f values/workforce.yaml
type: application
version: 0.1.0
appVersion: "0.1.0"
