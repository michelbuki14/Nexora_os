{{- if and .Values.existingSecret (not .Values.externalSecret.enabled) }}
# Fallback runtime secret: a fresh deployment must not fail because the ESO
# ExternalSecret is disabled. Populate `.Values.runtimeSecret` with the same
# keys the deployments consume (AOS_DATABASE__URL, AOS_REDIS__URL, S3 creds).
# In production, enable externalSecret and delete this Secret.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.existingSecret }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nexora.labels" . | nindent 4 }}
type: Opaque
data:
{{- range $key, $value := .Values.runtimeSecret }}
  {{ $key }}: {{ $value | b64enc | quote }}
{{- end }}
{{- end }}
