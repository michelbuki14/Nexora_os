{{- if .Values.externalSecret.enabled }}
# ExternalSecret (External Secrets Operator) -> AWS Secrets Manager -> cluster
# Secret `aos-runtime`. The runtime secret holds the connection strings and S3
# creds that must never live in the chart: AOS_DATABASE__URL, AOS_REDIS__URL,
# AOS_S3__ACCESS_KEY_ID, AOS_S3__SECRET_ACCESS_KEY.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.existingSecret }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aos.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind | default "SecretStore" }}
  target:
    name: {{ .Values.existingSecret }}
    creationPolicy: Owner
  data:
    {{- range .Values.externalSecret.remoteKeys }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ .remoteKey }}
    {{- end }}
{{- end }}
