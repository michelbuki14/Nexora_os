# Workforce Service — live Phase 1 module. Connects to Postgres + S3 (MinIO).
replicaCount: 2

image:
  repository: ghcr.io/michelbuki14/nexora-workforce-service
  tag: "0.1.0"

env:
  NEXORA_SERVICE__NAME: nexora-workforce-service
  NEXORA_SERVICE__ENVIRONMENT: production
  NEXORA_SERVER__HOST: 0.0.0.0
  NEXORA_SERVER__PORT: "3002"
  NEXORA_DATABASE__MAX_CONNECTIONS: "20"
  NEXORA_REDIS__MAX_CONNECTIONS: "50"
  NEXORA_AUTH__JWKS_URL: http://keycloak:8080/realms/nexora/protocol/openid-connect/certs
  NEXORA_AUTH__ISSUER: http://keycloak:8080/realms/nexora
  NEXORA_AUTH__AUDIENCE: nexora-api
  NEXORA_AUTH__JWKS_CACHE_TTL_SECS: "300"
  NEXORA_AUTH__REQUIRE_HTTPS: "false"
  NEXORA_TRACING__ENABLED: "true"
  NEXORA_TRACING__OTLP_ENDPOINT: http://nexora-grafana-tempo:4317
  NEXORA_TRACING__SAMPLE_RATE: "0.1"
  # S3 / MinIO in-cluster. Access keys + database URL come from the
  # `nexora-runtime` secret synced by ESO.
  NEXORA_S3__ENDPOINT: http://minio:9000
  NEXORA_S3__REGION: us-east-1
  NEXORA_S3__BUCKET: nexora-workforce-documents
  NEXORA_S3__PRESIGN_TTL_SECS: "60"
  NEXORA_S3__FORCE_PATH_STYLE: "true"

existingSecret: nexora-runtime

service:
  port: 3002
  targetPort: http

resources:
  limits:
    cpu: 1
    memory: 512Mi
  requests:
    cpu: 200m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
