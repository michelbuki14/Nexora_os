# API Gateway — exposes /api/v1/* and health. Does not connect to Postgres/Redis.
replicaCount: 2

image:
  repository: ghcr.io/michelbuki14/aos-api-gateway
  tag: "0.1.0"

env:
  AOS_SERVICE__NAME: aos-api-gateway
  AOS_SERVICE__ENVIRONMENT: production
  AOS_SERVER__HOST: 0.0.0.0
  AOS_SERVER__PORT: "3000"
  AOS_AUTH__JWKS_URL: http://keycloak:8080/realms/aos/protocol/openid-connect/certs
  AOS_AUTH__ISSUER: http://keycloak:8080/realms/aos
  AOS_AUTH__AUDIENCE: aos-api
  AOS_AUTH__JWKS_CACHE_TTL_SECS: "300"
  AOS_AUTH__REQUIRE_HTTPS: "false"
  AOS_TRACING__ENABLED: "true"
  AOS_TRACING__OTLP_ENDPOINT: http://aos-grafana-tempo:4317
  AOS_TRACING__SAMPLE_RATE: "0.1"
  # Reverse-proxy targets: Services deployed by the same chart set.
  AOS_GATEWAY__WORKFORCE_BASE_URL: http://aos-workforce-service:3002
  AOS_GATEWAY__AUDIT_BASE_URL: http://aos-audit-service:3001
  AOS_GATEWAY__TENANT_BASE_URL: http://aos-tenant-service:3004

existingSecret: aos-runtime

service:
  port: 3000
  targetPort: http

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70

ingress:
  enabled: true
  className: alb
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
  hosts:
    - host: api.aos.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - api.aos.example.com
      secretName: aos-api-tls
