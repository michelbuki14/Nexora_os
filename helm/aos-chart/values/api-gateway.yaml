# API Gateway — exposes /api/v1/* and health. Does not connect to Postgres/Redis.
replicaCount: 2

image:
  repository: ghcr.io/michelbuki14/nexora-api-gateway
  tag: "0.1.0"

env:
  NEXORA_SERVICE__NAME: nexora-api-gateway
  NEXORA_SERVICE__ENVIRONMENT: production
  NEXORA_SERVER__HOST: 0.0.0.0
  NEXORA_SERVER__PORT: "3000"
  NEXORA_AUTH__JWKS_URL: http://keycloak:8080/realms/nexora/protocol/openid-connect/certs
  NEXORA_AUTH__ISSUER: http://keycloak:8080/realms/nexora
  NEXORA_AUTH__AUDIENCE: nexora-api
  NEXORA_AUTH__JWKS_CACHE_TTL_SECS: "300"
  NEXORA_AUTH__REQUIRE_HTTPS: "false"
  NEXORA_TRACING__ENABLED: "true"
  NEXORA_TRACING__OTLP_ENDPOINT: http://nexora-grafana-tempo:4317
  NEXORA_TRACING__SAMPLE_RATE: "0.1"
  # Reverse-proxy targets: Services deployed by the same chart set.
  NEXORA_GATEWAY__WORKFORCE_BASE_URL: http://nexora-workforce-service:3002
  NEXORA_GATEWAY__AUDIT_BASE_URL: http://nexora-audit-service:3001
  NEXORA_GATEWAY__TENANT_BASE_URL: http://nexora-tenant-service:3004

  # Ingress host (override per-environment if needed).
  ingress:
    host: api.nexora.example.com
  # Legacy host alias — update DNS records when migrating from AOS to Nexora OS.
  # Old host: api.nexora.example.com

existingSecret: nexora-runtime

service:
  port: 3000
  targetPort: http

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70

ingress:
  enabled: true
  className: alb
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
  hosts:
    - host: api.nexora.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - api.nexora.example.com
      secretName: aos-api-tls
