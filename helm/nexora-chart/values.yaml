# Shared defaults for a Nexora OS service. Override per-service via values/*.yaml.
# Config model (services/common/src/config.rs): figment merges config.*.toml
# files with NEXORA_-prefixed env vars (double-underscore = nesting). In-cluster we
# drive everything through env vars so no config file needs mounting.

replicaCount: 2

image:
  repository: ghcr.io/michelbuki14/nexora
  tag: "0.1.0"
  pullPolicy: IfNotPresent

# The service image name (Dockerfile builds each binary, one tag per service).
# Per-service values set `image.repository` to the right image.
serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

# Nexora config. `service.name` is overridden per service.
# External infra (Keycloak, MinIO, Tempo) is deployed OUTSIDE this chart — it
# ships only the Nexora services. The env values below use short DNS names
# that must resolve inside the cluster; override per-service (values/*.yaml)
# with FQDNs if infra lives in another namespace.
# Monitoring configuration added for platform observability
env:
  NEXORA_SERVICE__ENVIRONMENT: production
  NEXORA_SERVER__HOST: 0.0.0.0
  NEXORA_SERVER__PORT: "3000"
  NEXORA_DATABASE__MAX_CONNECTIONS: "20"
  NEXORA_REDIS__MAX_CONNECTIONS: "50"
  NEXORA_AUTH__JWKS_URL: http://keycloak:8080/realms/nexora/protocol/openid-connect/certs
  NEXORA_AUTH__ISSUER: http://keycloak:8080/realms/nexora
  NEXORA_AUTH__AUDIENCE: nexora-api
  NEXORA_AUTH__JWKS_CACHE_TTL_SECS: "300"
  NEXORA_AUTH__REQUIRE_HTTPS: "false"
  NEXORA_TRACING__ENABLED: "true"
  NEXORA_TRACING__OTLP_ENDPOINT: http://nexora-grafana-tempo:4317
  NEXORA_TRACING__SAMPLE_RATE: "0.1"
  # Monitoring endpoints
  NEXORA_METRICS__ENABLED: "true"
  NEXORA_METRICS__SCRAPE_INTERVAL: "15s"
  NEXORA_HEALTH__PATH: "/health/ready"

# Secret values (DB URL, Redis URL, S3 creds). Referenced via secretKeyRef so
# they never land in the chart. ESO (External Secrets Operator) syncs
# AWS Secrets Manager entries into a cluster Secret named `nexora-runtime`.
existingSecret: nexora-runtime

# Bootstrap fallback (DEV ONLY): used when externalSecret.enabled=false so a
# fresh cluster actually starts. Override these in production or enable ESO.
runtimeSecret:
  NEXORA_DATABASE__URL: "postgres://nexora:nexora_dev_password@postgres:5432/nexora"
  NEXORA_REDIS__URL: "redis://:nexora_dev_password@redis:6379/0"
  NEXORA_S3__ACCESS_KEY_ID: "minioadmin"
  NEXORA_S3__SECRET_ACCESS_KEY: "minioadmin"

# External Secrets Operator source (opt-in; see templates/externalsecret.yaml).
# The cluster Secret it targets must contain keys matching the env var names,
# e.g. NEXORA_DATABASE__URL, NEXORA_REDIS__URL, NEXORA_S3__ACCESS_KEY_ID,
# NEXORA_S3__SECRET_ACCESS_KEY.
externalSecret:
  enabled: false
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  remoteKeys:
    - secretKey: NEXORA_DATABASE__URL
      remoteKey: nexora/production/database-url
    - secretKey: NEXORA_REDIS__URL
      remoteKey: nexora/production/redis-url
    - secretKey: NEXORA_S3__ACCESS_KEY_ID
      remoteKey: nexora/production/s3-access-key-id
    - secretKey: NEXORA_S3__SECRET_ACCESS_KEY
      remoteKey: nexora/production/s3-secret-access-key

# Container port the app listens on (must match NEXORA_SERVER__PORT).
service:
  port: 3000
  targetPort: http

# HTTP probes. All Nexora services expose /health, /health/live, /health/ready.
# These probes are used by Kubernetes for liveness/readiness detection
# and by Prometheus for service discovery.
probes:
  enabled: true
  # Liveness probe - checks if the service is still running
  liveness:
    path: /health/live
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 6
  # Readiness probe - checks if the service is ready to receive traffic
  readiness:
    path: /health/ready
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 6
  # Startup probe - waits for the service to start before enabling liveness/readiness
  # Only enabled if the service has a slow startup
  startup:
    enabled: false
    path: /health/ready
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 30
    failureThreshold: 12

# Resource limits and requests
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Autoscaling configuration
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

# Pod disruption budget for high availability
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Ingress is managed by the ALB controller in prod; values/*.yaml sets
# ingress.enabled + host + annotations per environment overlay.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

# Node selection / affinity for prod.
nodeSelector: {}
tolerations: []
affinity: {}
