services:
  # ─── Infrastructure ────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: nexora-postgres
    environment:
      POSTGRES_USER: nexora
      POSTGRES_PASSWORD: nexora_dev_password
      POSTGRES_DB: nexora
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Creates the keycloak DB + user on first boot
      - ./scripts/postgres-init.sql:/docker-entrypoint-initdb.d/01-keycloak.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexora -d nexora"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexora-network

  redis:
    image: redis:7-alpine
    container_name: nexora-redis
    command: redis-server --appendonly yes --requirepass nexora_dev_password
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "nexora_dev_password", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexora-network

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: nexora-keycloak
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_dev_password
      KC_HOSTNAME: keycloak
      KC_HOSTNAME_PORT: "8080"
      KC_HTTP_ENABLED: "true"
      # KC_PROXY: edge was removed in KC 24; use KC_PROXY_HEADERS instead
      KC_PROXY_HEADERS: xforwarded
    ports:
      - "8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    command: start-dev --import-realm
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The keycloak image ships no curl/wget; use a dependency-free bash TCP probe.
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8080' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
      - nexora-network

  minio:
    image: minio/minio:latest
    container_name: nexora-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexora-network

  jaeger:
    image: jaegertracing/all-in-one:1.53
    container_name: nexora-jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - nexora-network

  # ─── AOS Services ──────────────────────────────────────────────────────────
  # Each service reads its own config file via NEXORA_ENV; config.<env>.toml
  # is loaded by figment. We set NEXORA_ENV=docker so each service picks up
  # its config.<service>-docker.toml via the symlink trick below, OR we
  # override the config path per-service with NEXORA_CONFIG_FILE.
  # Simpler: set individual env vars that override the TOML fields directly
  # (figment merges NEXORA__-prefixed vars on top of the file).

  nexora-migrate:
    image: nexora-services:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexora-migrate
    entrypoint: ["nexora-migrate"]
    environment:
      NEXORA_DATABASE__URL: "postgresql://nexora:nexora_dev_password@postgres:5432/nexora"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nexora-network
    restart: "no"

  nexora-workforce-service:
    image: nexora-services:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexora-workforce-service
    entrypoint: ["nexora-workforce-service"]
    environment:
      NEXORA_ENV: docker
      # figment reads config.docker.toml then these env overrides win
      NEXORA_SERVICE__NAME: nexora-workforce-service
      NEXORA_SERVER__PORT: "3002"
      NEXORA_DATABASE__URL: "postgresql://nexora:nexora_dev_password@postgres:5432/nexora"
      NEXORA_REDIS__URL: "redis://:nexora_dev_password@redis:6379/0"
      NEXORA_AUTH__JWKS_URL: "http://keycloak:8080/realms/nexora/protocol/openid-connect/certs"
      NEXORA_AUTH__AUDIENCE: nexora-api
      NEXORA_AUTH__ISSUER: "http://keycloak:8080/realms/nexora"
      NEXORA_S3__ENDPOINT: "http://minio:9000"
      NEXORA_TRACING__OTLP_ENDPOINT: "http://jaeger:4317"
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      minio:
        condition: service_healthy
      nexora-migrate:
        condition: service_completed_successfully
    networks:
      - nexora-network
    restart: unless-stopped

  nexora-audit-service:
