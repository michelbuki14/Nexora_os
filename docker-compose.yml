version: '3.8'

services:
  # ─── Infrastructure ────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: aos-postgres
    environment:
      POSTGRES_USER: aos
      POSTGRES_PASSWORD: aos_dev_password
      POSTGRES_DB: aos
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Creates the keycloak DB + user on first boot
      - ./scripts/postgres-init.sql:/docker-entrypoint-initdb.d/01-keycloak.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aos -d aos"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aos-network

  redis:
    image: redis:7-alpine
    container_name: aos-redis
    command: redis-server --appendonly yes --requirepass aos_dev_password
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "aos_dev_password", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aos-network

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: aos-keycloak
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_dev_password
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: "8080"
      KC_HTTP_ENABLED: "true"
      # KC_PROXY: edge was removed in KC 24; use KC_PROXY_HEADERS instead
      KC_PROXY_HEADERS: xforwarded
    ports:
      - "8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    command: start-dev --import-realm
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health/ready || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - aos-network

  minio:
    image: minio/minio:latest
    container_name: aos-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aos-network

  jaeger:
    image: jaegertracing/all-in-one:1.53
    container_name: aos-jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - aos-network

  # ─── AOS Services ──────────────────────────────────────────────────────────
  # Each service reads its own config file via AOS_ENV; config.<env>.toml
  # is loaded by figment. We set AOS_ENV=docker so each service picks up
  # its config.<service>-docker.toml via the symlink trick below, OR we
  # override the config path per-service with AOS_CONFIG_FILE.
  # Simpler: set individual env vars that override the TOML fields directly
  # (figment merges AOS__-prefixed vars on top of the file).

  aos-migrate:
    image: aos-services:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aos-migrate
    entrypoint: ["aos-migrate"]
    environment:
      AOS_DATABASE__URL: "postgresql://aos:aos_dev_password@postgres:5432/aos"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aos-network
    restart: "no"

  aos-workforce-service:
    image: aos-services:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aos-workforce-service
    entrypoint: ["aos-workforce-service"]
    environment:
      AOS_ENV: docker
      # figment reads config.docker.toml then these env overrides win
      AOS_SERVICE__NAME: aos-workforce-service
      AOS_SERVER__PORT: "3002"
      AOS_DATABASE__URL: "postgresql://aos:aos_dev_password@postgres:5432/aos"
      AOS_REDIS__URL: "redis://:aos_dev_password@redis:6379/0"
      AOS_AUTH__JWKS_URL: "http://keycloak:8080/realms/aos/protocol/openid-connect/certs"
      AOS_AUTH__ISSUER: "http://keycloak:8080/realms/aos"
      AOS_S3__ENDPOINT: "http://minio:9000"
      AOS_TRACING__OTLP_ENDPOINT: "http://jaeger:4317"
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      minio:
        condition: service_healthy
      aos-migrate:
        condition: service_completed_successfully
    networks:
      - aos-network
    restart: unless-stopped

  aos-audit-service:
    image: aos-services:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aos-audit-service
    entrypoint: ["aos-audit-service"]
    environment:
      AOS_ENV: docker
      AOS_SERVICE__NAME: aos-audit-service
      AOS_SERVER__PORT: "3001"
      AOS_DATABASE__URL: "postgresql://aos:aos_dev_password@postgres:5432/aos"
      AOS_REDIS__URL: "redis://:aos_dev_password@redis:6379/0"
      AOS_AUTH__JWKS_URL: "http://keycloak:8080/realms/aos/protocol/openid-connect/certs"
      AOS_AUTH__ISSUER: "http://keycloak:8080/realms/aos"
      AOS_TRACING__OTLP_ENDPOINT: "http://jaeger:4317"
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      aos-migrate:
        condition: service_completed_successfully
    networks:
      - aos-network
    restart: unless-stopped

  aos-tenant-service:
    image: aos-services:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aos-tenant-service
    entrypoint: ["aos-tenant-service"]
    environment:
      AOS_ENV: docker
      AOS_SERVICE__NAME: aos-tenant-service
      AOS_SERVER__PORT: "3004"
      AOS_DATABASE__URL: "postgresql://aos:aos_dev_password@postgres:5432/aos"
      AOS_REDIS__URL: "redis://:aos_dev_password@redis:6379/0"
      AOS_AUTH__JWKS_URL: "http://keycloak:8080/realms/aos/protocol/openid-connect/certs"
      AOS_AUTH__ISSUER: "http://keycloak:8080/realms/aos"
      AOS_TRACING__OTLP_ENDPOINT: "http://jaeger:4317"
    ports:
      - "3004:3004"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      aos-migrate:
        condition: service_completed_successfully
    networks:
      - aos-network
    restart: unless-stopped

  aos-api-gateway:
    image: aos-services:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aos-api-gateway
    entrypoint: ["aos-api-gateway"]
    environment:
      AOS_ENV: docker
      AOS_SERVICE__NAME: aos-api-gateway
      AOS_SERVER__PORT: "3000"
      AOS_DATABASE__URL: "postgresql://aos:aos_dev_password@postgres:5432/aos"
      AOS_REDIS__URL: "redis://:aos_dev_password@redis:6379/0"
      AOS_AUTH__JWKS_URL: "http://keycloak:8080/realms/aos/protocol/openid-connect/certs"
      AOS_AUTH__ISSUER: "http://keycloak:8080/realms/aos"
      AOS_GATEWAY__WORKFORCE_BASE_URL: "http://aos-workforce-service:3002"
      AOS_GATEWAY__AUDIT_BASE_URL: "http://aos-audit-service:3001"
      AOS_GATEWAY__TENANT_BASE_URL: "http://aos-tenant-service:3004"
      AOS_TRACING__OTLP_ENDPOINT: "http://jaeger:4317"
    ports:
      - "3000:3000"
    depends_on:
      aos-workforce-service:
        condition: service_started
      aos-audit-service:
        condition: service_started
      aos-tenant-service:
        condition: service_started
    networks:
      - aos-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  keycloak_data:
  minio_data:

networks:
  aos-network:
    driver: bridge
