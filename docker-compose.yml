    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexora-audit-service
    entrypoint: ["nexora-audit-service"]
    environment:
      NEXORA_ENV: docker
      NEXORA_SERVICE__NAME: nexora-audit-service
      NEXORA_SERVER__PORT: "3001"
      NEXORA_DATABASE__URL: "postgresql://nexora:nexora_dev_password@postgres:5432/nexora"
      NEXORA_REDIS__URL: "redis://:nexora_dev_password@redis:6379/0"
      NEXORA_AUTH__JWKS_URL: "http://keycloak:8080/realms/nexora/protocol/openid-connect/certs"
      NEXORA_AUTH__AUDIENCE: nexora-api
      NEXORA_AUTH__ISSUER: "http://keycloak:8080/realms/nexora"
      NEXORA_TRACING__OTLP_ENDPOINT: "http://jaeger:4317"
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      nexora-migrate:
        condition: service_completed_successfully
    networks:
      - nexora-network
    restart: unless-stopped

  nexora-tenant-service:
    image: nexora-services:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexora-tenant-service
    entrypoint: ["nexora-tenant-service"]
    environment:
      NEXORA_ENV: docker
      NEXORA_SERVICE__NAME: nexora-tenant-service
      NEXORA_SERVER__PORT: "3004"
      NEXORA_DATABASE__URL: "postgresql://nexora:nexora_dev_password@postgres:5432/nexora"
      NEXORA_REDIS__URL: "redis://:nexora_dev_password@redis:6379/0"
      NEXORA_AUTH__JWKS_URL: "http://keycloak:8080/realms/nexora/protocol/openid-connect/certs"
      NEXORA_AUTH__AUDIENCE: nexora-api
      NEXORA_AUTH__ISSUER: "http://keycloak:8080/realms/nexora"
      NEXORA_TRACING__OTLP_ENDPOINT: "http://jaeger:4317"
    ports:
      - "3004:3004"
    depends_on:
      nexora-workforce-service:
        condition: service_started
      nexora-audit-service:
        condition: service_started
    networks:
      - nexora-network
    restart: unless-stopped

  nexora-fintech-service:
