# AOS API Gateway — Docker / docker-compose configuration.
# Service names match docker-compose.yml container names on the aos-network.

[service]
name = "aos-api-gateway"
version = "0.1.0"
environment = "development"

[server]
host = "0.0.0.0"
port = 3000
request_timeout_secs = 30
body_limit_bytes = 10485760
graceful_shutdown_secs = 30

[database]
url = "postgres://aos:aos_dev_password@postgres:5432/aos"
max_connections = 20
min_connections = 5
connect_timeout_secs = 10
idle_timeout_secs = 300
max_lifetime_secs = 1800
enable_logging = false

[redis]
url = "redis://:aos_dev_password@redis:6379/0"
max_connections = 50
connection_timeout_secs = 5
command_timeout_secs = 5

[auth]
jwks_url = "http://keycloak:8080/realms/aos/protocol/openid-connect/certs"
issuer = "http://keycloak:8080/realms/aos"
audience = "aos-api"
jwks_cache_ttl_secs = 300
require_https = false
allowed_algorithms = ["RS256"]

[tracing]
enabled = true
otlp_endpoint = "http://jaeger:4317"
service_name = "aos-api-gateway"
sample_rate = 1.0
export_timeout_secs = 10

[gateway]
workforce_base_url = "http://aos-workforce-service:3002"
audit_base_url = "http://aos-audit-service:3001"
tenant_base_url = "http://aos-tenant-service:3004"

[features]
audit_enabled = false
commerce_enabled = false
finance_enabled = false
government_enabled = false
