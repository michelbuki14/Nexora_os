# Nexora OS Workforce Service — Docker / docker-compose configuration.

[service]
name = "nexora-workforce-service"
version = "0.1.0"
environment = "development"

[server]
host = "0.0.0.0"
port = 3002
request_timeout_secs = 30
body_limit_bytes = 10485760
graceful_shutdown_secs = 30

[database]
url = "postgres://nexora:nexora_dev_password@postgres:5432/nexora"
max_connections = 20
min_connections = 5
connect_timeout_secs = 10
idle_timeout_secs = 300
max_lifetime_secs = 1800
enable_logging = false

[redis]
url = "redis://:nexora_dev_password@redis:6379/0"
max_connections = 20
connection_timeout_secs = 5
command_timeout_secs = 5

[auth]
jwks_url = "http://keycloak:8080/realms/nexora/protocol/openid-connect/certs"
issuer = "http://keycloak:8080/realms/nexora"
audience = "nexora-api"
jwks_cache_ttl_secs = 300
require_https = false
allowed_algorithms = ["RS256"]

[tracing]
enabled = true
otlp_endpoint = "http://jaeger:4317"
service_name = "nexora-workforce-service"
sample_rate = 1.0
export_timeout_secs = 10

[s3]
endpoint = "http://minio:9000"
region = "us-east-1"
bucket = "nexora-workforce-documents"
access_key_id = "minioadmin"
secret_access_key = "minioadmin"
presign_ttl_secs = 60
force_path_style = true
