# AOS Workforce Service — local development configuration.
# Matches docker-compose.yml (aos-postgres / aos-redis / aos-keycloak / aos-minio).

[service]
name = "aos-workforce-service"
version = "0.1.0"
environment = "development"

[server]
host = "0.0.0.0"
port = 3002
request_timeout_secs = 30
body_limit_bytes = 10485760
graceful_shutdown_secs = 30

[database]
url = "postgresql://aos:aos_dev_password@localhost:5432/aos"
max_connections = 20
min_connections = 5
connect_timeout_secs = 10
idle_timeout_secs = 300
max_lifetime_secs = 1800
enable_logging = true

[redis]
url = "redis://:aos_dev_password@localhost:6379/0"
max_connections = 20
connection_timeout_secs = 5
command_timeout_secs = 5

[auth]
jwks_url = "http://localhost:8080/realms/aos/protocol/openid-connect/certs"
issuer = "http://localhost:8080/realms/aos"
audience = "aos-api"
jwks_cache_ttl_secs = 300
require_https = false
allowed_algorithms = ["RS256"]

[tracing]
enabled = false
otlp_endpoint = "http://localhost:4317"
service_name = "aos-workforce-service"
sample_rate = 1.0
export_timeout_secs = 10

[s3]
endpoint = "http://localhost:9000"
region = "us-east-1"
bucket = "aos-workforce-documents"
access_key_id = "minioadmin"
secret_access_key = "minioadmin"
presign_ttl_secs = 60
force_path_style = true
